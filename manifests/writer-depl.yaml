apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: earthquakes-app
  labels:
    run: writer
spec:
  replicas: 1
  selector:
    matchLabels:
      run: writer

  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  template:
    metadata:
      labels:
        run: writer
    spec:
      nodeSelector:
        kubernetes.io/hostname: arboretum
      containers:
        - image: localhost:5000/writer:latest
          imagePullPolicy: Always
          name: writer
          env:
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: SUB_SUBJECT
              value: "earthquakes.events"
            - name: DB_URL
              value: "postgresql://postgres:letmein@:postgres-service:5432/earthquakes-db"

          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
          restartPolicy: Always
